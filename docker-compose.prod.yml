services:
  waha:
    image: devlikeapro/waha:latest
    container_name: csm-waha
    restart: unless-stopped
    environment:
      WAHA_API_KEY: ${WAHA_API_KEY}
      WAHA_API_KEY_PLAIN: ${WAHA_API_KEY_PLAIN}
      WAHA_DASHBOARD_USERNAME: ${WAHA_DASHBOARD_USERNAME:-admin}
      WAHA_DASHBOARD_PASSWORD: ${WAHA_DASHBOARD_PASSWORD}
      WHATSAPP_SWAGGER_USERNAME: ${WAHA_DASHBOARD_USERNAME:-admin}
      WHATSAPP_SWAGGER_PASSWORD: ${WAHA_DASHBOARD_PASSWORD}
      WHATSAPP_SWAGGER_ENABLED: "false"
      WHATSAPP_DASHBOARD_ENABLED: "true"
    volumes:
      - waha_sessions:/app/.sessions
    ports:
      - "127.0.0.1:3005:3000"
    networks:
      - csm-net

  backend:
    build: ./backend
    container_name: csm-crm-backend
    restart: unless-stopped
    depends_on:
      - waha
    environment:
      DATABASE_URL: ${DATABASE_URL}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      APP_URL: ${APP_URL}
      PORT: 5000
      NODE_ENV: production
      EMAIL_WEBHOOK_URL: ${EMAIL_WEBHOOK_URL}
      EMAIL_FROM: ${EMAIL_FROM}
      VENDOR_QUOTATION_EXPIRY_DAYS: ${VENDOR_QUOTATION_EXPIRY_DAYS:-7}
      WHATSAPP_ENABLED: ${WHATSAPP_ENABLED:-true}
      WHATSAPP_API_URL: http://waha:3000
      WHATSAPP_API_KEY: ${WHATSAPP_API_KEY}
      WHATSAPP_SESSION: ${WHATSAPP_SESSION:-default}
      WHATSAPP_GROUP_NAME: ${WHATSAPP_GROUP_NAME:-CA Management}
      WHATSAPP_GROUP_ID: ${WHATSAPP_GROUP_ID:-}
      WHATSAPP_SENDER_HINT: ${WHATSAPP_SENDER_HINT:-0212147160}
      BACKUP_DIR: ${BACKUP_DIR:-/backups}
      BACKUP_HOST_HINT: ${BACKUP_HOST_HINT:-/opt/ceylon-crm/backups}
    volumes:
      - ./backups:/backups
    ports:
      - "127.0.0.1:5020:5000"
    networks:
      - csm-net

  frontend:
    build: ./frontend
    container_name: csm-crm-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "127.0.0.1:8097:80"
    networks:
      - csm-net

volumes:
  waha_sessions:

networks:
  csm-net:
    driver: bridge
